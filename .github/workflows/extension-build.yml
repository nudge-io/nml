name: Extension build & E2E

# Reusable: the single source of truth for building + testing + packaging the VS
# Code extension. Called by ci.yml (on push/PR) and release.yml (on a tag, where
# it is the E2E gate — the release's publish job runs only if this succeeds).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build · typecheck · E2E · package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Building the WASM server here also guards that the wasm32 cfg-gated code
      # (the synchronous pump) compiles.
      #
      # The pin file (rust-toolchain.toml) is the only toolchain authority:
      # rustup materializes it (channel + components) from an argless
      # install, and the target is added to THAT toolchain — installing
      # either for any other named toolchain (e.g. `stable`) leaves the one
      # cargo actually uses target-less (E0463 "can't find crate for core").
      - run: rustup toolchain install && rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build the WASM neutral server
        # --locked: this wasm ships inside the VSIX — the release artifact
        # must be built from exactly the dependency set the gates verified.
        run: cargo build -p nml-lsp --target wasm32-wasip1 --release --locked

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install extension deps
        run: pnpm install --frozen-lockfile

      - name: Extension verify (toolchain · typecheck · unit · bundle · audit)
        run: pnpm --filter nml-lang run verify:ci

      # `pnpm test` runs the pretest (vscodePrepublish: wasm + js + compile), then
      # drives a real headless VS Code (downloading it + `ms-vscode.wasm-wasi-core`)
      # over the single-root and multi-root E2E suites. Xvfb gives Electron a
      # virtual display — started EXPLICITLY, not via `xvfb-run`: the wrapper's
      # exit trap races Xvfb's teardown over its temp dir and dies with its own
      # exit 5 ("problem while cleaning up temporary directory") AFTER a fully
      # green suite, failing the job on cleanup the ephemeral runner would do
      # anyway. With an explicit server there is no wrapper cleanup to race:
      # the step's exit code is the test runner's, nothing else's.
      - name: End-to-end tests (headless VS Code)
        working-directory: editors/vscode
        run: |
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          DISPLAY=:99 pnpm test

      - name: Package the VSIX
        run: pnpm --filter nml-lang run package

      - name: Upload the VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nml-lang-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error
