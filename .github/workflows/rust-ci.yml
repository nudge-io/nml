name: Rust CI

# Reusable: the single source of truth for the Rust checks. Called by ci.yml (on
# push/PR) and release.yml (as a gate — the release's publish job needs it, so a
# fmt/clippy/test failure blocks the release before anything is published).
#
# TOOLCHAIN ARCHITECTURE: gate jobs run THE PINNED toolchain, and the pin
# lives in exactly one place — rust-toolchain.toml (channel + components).
# rustup honors that file natively, so pinned jobs never restate a version:
# an argless `rustup toolchain install` materializes the file's toolchain,
# components included, and every later cargo call resolves to it. The only
# jobs that name a toolchain are the ones whose PURPOSE is a different
# toolchain: msrv (the floor from Cargo.toml, forced via RUSTUP_TOOLCHAIN —
# the env var outranks the pin file), minimal-versions' nightly resolver
# step (reached via explicit `cargo +nightly`), and the api job's rustdoc JSON
# build (nightly via dtolnay/rust-toolchain plus `just gate-api`). New stables land via
# canary.yml + a reviewed toolchain-bump PR — never by drift.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: fmt · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The file names the channel AND components (rustfmt, clippy).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      # fmt + clippy + rustdoc (a build product: broken intra-doc links fail
      # here, not on docs.rs). The commands are in `just gate-lint`.
      # The contract itself: this job fails if any workflow here runs a gate
      # command that is not a `just` recipe, or if a `gate-*` recipe is one
      # nothing runs. It also self-tests, so it cannot be a green no-op.
      - run: just gate-contract
      - run: just gate-lint

  # Supply-chain & license gate (see deny.toml): permissive-only dep licenses +
  # RustSec security advisories + a crates.io-only source policy. Reads the
  # dependency graph — no build needed.
  supply-chain:
    name: licenses · advisories · sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      # cargo-deny run as a PINNED BINARY rather than a third-party action:
      # the action had no local equivalent at all, so the licence/advisory
      # gate was one a developer could not run before pushing.
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: just gate-supply-chain

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      - run: just gate-test
      # The four perf tripwires (`#[ignore]`d in the default run — release-
      # timed, with 30–200× headroom) run on the ONE lane whose timing is
      # stable enough to trust, alone (`--test-threads=1`): the linear-parser
      # and compose-cost pins (r69a, C2), the CLI's wide-stack wall-clock
      # gates (r69b item 9), the kernel's real-bound drives (r73), and the
      # read-through race harness's six perf forms. The commands are in
      # `just gate-perf`, so they are runnable before pushing — which they
      # were not while they existed only in this file.
      - if: matrix.os == 'ubuntu-latest'
        run: just gate-perf

  # The MSRV contract (docs/stability.md): the workspace compiles — every
  # target, every platform the test matrix covers, doctests included — on
  # exactly the `rust-version` floor declared in Cargo.toml, which this job
  # READS so the manifest stays the single source of truth (an MSRV bump is
  # a one-line change; this job follows). `--locked` pins the committed,
  # MSRV-compatible dependency set: a dependency raising its own floor
  # surfaces as a reviewed lockfile-update failure here, never as a
  # downstream user's broken build. Check-only by design — the MSRV promise
  # is "it builds"; behavior stays the stable matrix's job.
  msrv:
    name: msrv (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The floor toolchain is installed BY the recipe, which reads
      # `rust-version` from Cargo.toml — so the version lives in exactly one
      # place and this job cannot check a different one. (It used to be read
      # here as well, into RUSTUP_TOOLCHAIN, which is two readings of one
      # fact.) The pinned toolchain is installed first only so `cargo` and
      # `just` exist at all.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      # `just gate-msrv` reads the floor from Cargo.toml itself, so this job
      # and a developer's machine cannot disagree about what the MSRV IS.
      - run: just gate-msrv

  # Publish-readiness, continuously: `cargo package` validates metadata,
  # file sets, and (via its verify build) that each publishable crate
  # compiles from its own tarball — so publish day is a decision, not a
  # debugging session. The tutorial apps and the cookbook are excluded
  # explicitly: `publish = false` blocks *uploading*, but `cargo package`
  # still packages such members (measured), and they are not publish
  # surface.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      - run: just gate-package

  # Declared version bounds are promises (`serde = "1"` claims we build
  # against serde 1.0.0). Resolve every DIRECT dependency to its declared
  # minimum (nightly resolver flag), then prove the workspace still
  # compiles on the pinned toolchain. Catches under-declared bounds before
  # a downstream user's cold lockfile does. Deliberately unlocked: this
  # job's whole point is a different resolution.
  minimal-versions:
    name: minimal versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pin (for the check step, via the file)…
      - run: rustup toolchain install
      # …plus nightly, reached ONLY via explicit `cargo +nightly` (the
      # resolver flag needs it; the pin file governs everything else).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (SHA-pinned; channel via toolchain input)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      - run: just gate-minimal-versions

  # The PUBLIC API contract. `nml`'s libraries are consumed by PATH and by
  # PINNED REV (the consumer's `nml-pin.toml`), never resolved from
  # crates.io, so cargo's version resolution protects nobody — one fold
  # shipped EIGHTEEN breaking API changes and three of them
  # were discovered by the consumer failing to compile, days later. Two
  # checks, because neither is complete alone: the RECORD
  # (`cargo public-api`) shows every public item that moved, including
  # shapes no lint models; the CLASSIFIER (`cargo-semver-checks`) names
  # what a record cannot see — above all a new PRIVATE field on a public
  # struct, which makes it unconstructible downstream while every public
  # item stays identical (measured on `ast::Arm`).
  api:
    name: public API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The classifier needs the baseline commit, not just this one.
          fetch-depth: 0
      - run: rustup toolchain install
      # `cargo public-api` builds rustdoc JSON with nightly (not the pin
      # file's active toolchain). Installed here so a cached `just gate-api`
      # on a runner that never ran the recipe still has it; the recipe
      # re-installs/updates the same channel before `cargo public-api`.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (SHA-pinned; channel via toolchain input)
        with:
          toolchain: nightly
          profile: minimal
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      # The record is fresh, stamped and in the ledger; then what moved is
      # classified against the base branch. The two pinned tools are
      # installed BY the recipe, so a local run installs the same versions.
      - run: just gate-api
        env:
          NML_API_BASELINE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The fuzz crate lives OUTSIDE the workspace (root Cargo.toml
      # `exclude`) because libFuzzer needs nightly; this job is a smoke
      # pass over the RFC 0016 targets — a short bounded run per target so
      # a panic/invariant regression fails CI, while deep fuzzing stays a
      # scheduled/local activity.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (SHA-pinned; channel via toolchain input)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: fuzz
      # Version-pinned like every other tool in this workflow (the repo
      # posture: SHA-pinned actions, committed lockfiles — including
      # fuzz/Cargo.lock — and canary-driven bumps).
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      # Persistent coverage corpus (first-party actions/cache, SHA
      # verified against upstream v6.1.0): every run restores the newest
      # prior corpus via the prefix restore-key and saves its grown copy
      # under a fresh run-scoped key, so coverage-guided progress
      # ACCUMULATES across CI runs instead of restarting from the seeds —
      # the ClusterFuzzLite core idea with zero third-party action
      # surface. Old entries age out via GitHub's LRU cache eviction.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      # The gate runner. Every gate command lives in the justfile and
      # NOWHERE else — `just gate-contract` fails this build if a workflow
      # runs one any other way (scripts/gate.py). Version-pinned like
      # cargo-fuzz and cargo-deny below; `rust-cache` keeps ~/.cargo/bin.
      - run: cargo install just --version 1.46.0 --locked
      - name: smoke-run every fuzz target
        # Every target in fuzz_targets/ runs, ENUMERATED FROM THE DIRECTORY
        # (r69a, C1): a hand-kept list silently omitted the RFC 0019 item-0
        # targets for a whole certification arc. The loop is in
        # `just gate-fuzz`, so the sweep is reproducible locally; `just fuzz
        # <target>` is the deep dive on one.
        run: just gate-fuzz
      # actions/cache saves only on job SUCCESS (post-if), so the run that
      # FINDS a crash would otherwise discard both its grown corpus and the
      # reproducer libFuzzer writes to fuzz/artifacts — preserve the
      # reproducer explicitly (first-party action, SHA verified against
      # upstream v7.0.1).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # `always()` (not `failure()`): a job TIMEOUT is a cancellation,
        # not a failure, and a hang is exactly when the partial corpus and
        # any reproducer are most worth keeping. On success there is
        # nothing to upload and `if-no-files-found: ignore` makes that a
        # no-op.
        if: always()
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
