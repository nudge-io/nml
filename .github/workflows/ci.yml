name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both pipelines live in reusable workflows so CI and release run byte-identical
# checks. Rust = fmt + clippy + cross-platform tests; extension = build + WASM +
# typecheck + headless E2E + package.
jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/rust-ci.yml

  # Docs examples are executable: tagged ```nml blocks in the Markdown docs run
  # through the real CLI (scripts/docs_test.py), so guide snippets cannot rot.
  docs:
    name: docs examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (SHA-pinned; channel via toolchain input)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build -p nml-cli
      - run: python3 scripts/docs_test.py

  extension:
    name: VS Code extension
    uses: ./.github/workflows/extension-build.yml
