name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Both pipelines live in reusable workflows so CI and release run byte-identical
# checks. Rust = fmt + clippy + cross-platform tests; extension = build + WASM +
# typecheck + headless E2E + package.
jobs:
  rust:
    name: Rust
    uses: ./.github/workflows/rust-ci.yml

  # Docs examples are executable: tagged ```nml blocks in the Markdown docs run
  # through the real CLI (scripts/docs_test.py), so guide snippets cannot rot.
  docs:
    name: docs examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pin file is the only toolchain authority — see rust-ci.yml's
      # architecture note.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # The gate runner — see rust-ci.yml's note. Every gate command lives
      # in the justfile and nowhere else.
      - run: cargo install just --version 1.46.0 --locked
      # Builds the CLI and pre-builds the cookbook (so the harness's per-example
      # runs never pay the crate's cold compile), then runs the suite.
      - run: just gate-docs

  extension:
    name: VS Code extension
    uses: ./.github/workflows/extension-build.yml
