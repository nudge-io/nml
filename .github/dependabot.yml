version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions current (Dependabot bumps the commit SHA
  # and its `# vX` comment together), so pinning stays secure without going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # VS Code extension dependencies.
  #
  # @types/vscode is excluded from automation: its version must move in lockstep
  # with engines.vscode (see editors/vscode/VSCODE-API.md). Grouped bumps that
  # include @types/vscode break `vsce package` (e.g. PR #8).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      pnpm-production:
        dependency-type: production
        patterns: ["*"]
      pnpm-development:
        dependency-type: development
        patterns: ["*"]
        exclude-patterns:
          - "@types/vscode"
    ignore:
      - dependency-name: "@types/vscode"

  # Rust workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
