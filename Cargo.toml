[workspace]
resolver = "2"
members = [
    "crates/nml-core",
    "crates/nml-validate",
    "crates/nml-fmt",
    "crates/nml-lsp",
    "nml-cli",
    # Tutorial chapter programs — compiled AND run by `just docs-test`
    # (scripts/docs_test.py TUTORIAL_APPS), so the tutorial's Rust chapters
    # cannot rot. Workspace membership keeps fmt/clippy/test covering them.
    "docs/tutorial/examples/07/app",
    "docs/tutorial/examples/08/app",
    "docs/tutorial/examples/09/app",
    # Cookbook recipes — every guide page's Rust is a compiled, executed
    # example target here (scripts/docs_test.py runs them all).
    "docs/guides/examples/cookbook",
]
# cargo-fuzz targets (RFC 0016 §2): nightly-only tooling, deliberately
# OUTSIDE the workspace so the MSRV / minimal-versions / package / fmt /
# clippy gates never see it. Run via `cargo +nightly fuzz` from fuzz/.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The MSRV contract (docs/stability.md): measured floor, enforced by the CI
# `msrv` job on exactly this toolchain (which reads the number from this
# line — this is the single source of truth). Set by the icu_* dependency
# family (via url/idna under tower-lsp), not by our code. Raising it is a
# minor-version event, always CHANGELOG-noted.
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nudge-io/nml"
homepage = "https://github.com/nudge-io/nml"
keywords = ["configuration", "config", "language", "parser", "schema"]
categories = ["config", "parser-implementations"]

[workspace.dependencies]
# Internal deps carry both path (workspace builds) and version (publishing:
# crates.io strips `path`, and publish fails without a version requirement).
nml-core = { path = "crates/nml-core", version = "0.1.0" }
nml-validate = { path = "crates/nml-validate", version = "0.1.0" }
nml-fmt = { path = "crates/nml-fmt", version = "0.1.0" }
thiserror = "2"
# ≥1.0.225: required by toml 1.1+ (`serde_core` floor). ≥1.0.220 for the
# serde/serde_core split — older serde cannot compile the resolved graph.
# The workspace's honest floor (verified by the CI minimal-versions job).
serde = { version = "1.0.225", features = ["derive"] }
# ≥1.0.50: tower-lsp's requirement; the workspace's honest floor (verified
# by the CI minimal-versions job).
serde_json = "1.0.50"
tower-lsp = "0.20"
# ≥1.17: tower-lsp's own requirement; the workspace's honest floor (verified
# by the CI minimal-versions job).
tokio = { version = "1.17", features = ["full"] }
rowan = "0.16"
