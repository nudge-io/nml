[package]
name = "nml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Excluded from the parent workspace (root Cargo.toml `exclude`): fuzzing
# is nightly-only and must never gate MSRV / minimal-versions / packaging.
# Usage:  cargo install cargo-fuzz --locked
#         cd fuzz && cargo +nightly fuzz run number
# Corpus seeds: `cargo +nightly fuzz run <target> ../tests/fixtures/valid`

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `format` compares span-erased lowered trees; `compose` compares the
# composed view of one file against itself.
serde_json = "1"
nml-core = { path = "../crates/nml-core" }
nml-fmt = { path = "../crates/nml-fmt" }
# `test-support` for the scripted `MockFs` the `paths` target drives.
nml-validate = { path = "../crates/nml-validate", features = ["test-support"] }

[[bin]]
name = "number"
path = "fuzz_targets/number.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false

