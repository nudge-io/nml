[package]
name = "nml-lsp"
description = "Language Server Protocol implementation for NML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "nml_lsp"
path = "src/lib.rs"

[[bin]]
name = "nml-lsp"
path = "src/main.rs"

[dependencies]
# Parses via the RFC 0004 CST: resilience (validation works mid-edit), all-errors
# diagnostics, exact spans, and comment attachment for hover-on-comment.
nml-core = { workspace = true }
nml-validate = { workspace = true }
nml-fmt = { workspace = true }
serde_json = { workspace = true }
tower-lsp = { workspace = true }
# `NmlService` (see `session.rs`) is a `tower::Service` around tower-lsp's own
# `LspService`: one look at the raw `initialize` params for the capability
# lsp-types cannot deserialize. tower-service 0.3 — the trait tower-lsp's
# `Server::serve` requires — is what this re-exports, and the crate is already
# in the tree (tower-lsp depends on it), so the lock is unchanged.
tower = { version = "0.5", default-features = false, features = ["util"] }
# Canonicalize WITHOUT the Windows `\\?\` verbatim prefix: `std::fs::canonicalize`
# yields verbatim paths on Windows, which `Url::from_file_path` mishandles — and
# the server round-trips canonicalized paths through URIs (doc lookup, roots).
# `dunce` is byte-for-byte `std` on non-Windows, so it changes nothing on
# Unix/WASM and fixes URI matching on Windows.
dunce = "1"

# Directory listings for the wasm editor (`src/wasi_fs.rs`): `rustix::fs::Dir`
# closes a directory stream without asserting that the close succeeded, which
# `std`'s `ReadDir` does — and `wasm-wasi-core` fails the close of a mount
# root's descriptor, aborting the guest. SAFE bindings only; the crate forbids
# `unsafe`. Already in the tree (nml-validate's race-free reader), so the lock
# gains no package.
[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

# tokio's feature surface is target-split (RFC 0035 WASM delivery). Native gets
# the workspace's full tokio. `wasm32` (the in-editor neutral server, run under
# VS Code's `wasm-wasi-core`) gets ONLY the wasm-supported subset — `net`/`fs`/
# multi-thread pull in `mio`, which does not build on wasm. The runtime shell
# uses exactly this subset; the stdio transport is target-split in `transport`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same honest floor as the workspace tokio (see workspace Cargo.toml); kept
# non-workspace because the FEATURE SET is the wasm subset, not "full".
tokio = { version = "1.17", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
] }
# The wasm synchronous pump (`transport::pump`) drives the service directly:
# `futures` for stream draining and `serde` for framing the JSON-RPC wire
# (`tower`, the Service/ready/call surface, is a dependency on every target).
# Native drives via tower-lsp's own `Server::serve`, so these are wasm-only.
futures = { version = "0.3", default-features = false }
serde = { workspace = true }

[features]
# What the integration harness and the CLI's parity test drive directly
# (`lib.rs` `test_support`): enabled by those test crates alone, never by a
# build, so nothing behind it is in the recorded public API.
test-support = []

[dev-dependencies]
# The crate's own integration tests enable `test-support` for themselves.
nml-lsp = { path = ".", features = ["test-support"] }
nml-validate = { workspace = true, features = ["test-support"] }
# In-process duplex harness (tests/harness.rs): `tower` drives the LspService
# as a plain `tower::Service` (`service.ready().await.call(..)`), `futures`
# drains the ClientSocket stream and answers server->client requests via its
# Sink half. Both are already in the tree as tower-lsp dependencies (same
# versions), so this adds no new compiles to a full build.
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
